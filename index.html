<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%23070C16%22%2F%3E%3Crect%20x%3D%221.5%22%20y%3D%221.5%22%20width%3D%2229%22%20height%3D%2229%22%20rx%3D%225%22%20fill%3D%22none%22%20stroke%3D%22%23D4AC55%22%20stroke-width%3D%221.5%22%2F%3E%3Ctext%20x%3D%2216%22%20y%3D%2222.5%22%20font-family%3D%22monospace%22%20font-size%3D%2215%22%20font-weight%3D%22700%22%20fill%3D%22%23D4AC55%22%20text-anchor%3D%22middle%22%3EPQ%3C%2Ftext%3E%3C%2Fsvg%3E">
<title>Peoplequake Lab · Build Record</title>
<meta name="description" content="직접 설계하고 직접 만든 웹 앱 기록">
<meta property="og:title" content="Peoplequake Lab · Build Record">
<meta property="og:description" content="기획부터 코드, 배포, 보안 판단까지 직접 처리한 웹 앱 기록">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#070C16;
  --surface:#0E1626;
  --surface-2:#131E33;
  --line:#22344F;
  --line-soft:#1A2740;
  --text:#F0F4FA;
  --text-2:#A9BAD2;
  --dim:#7286A5;
  --brass:#D4AC55;
  --sage:#7FB39C;
  --slate:#8FA6C4;
  --sans:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  --mono:'IBM Plex Mono','IBM Plex Sans KR',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--ink);color:var(--text);
  font-family:var(--sans);font-weight:400;
  font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  position:relative;overflow-x:hidden;
}
/* 평면 네이비를 띄우는 배경 — 텍스트가 뜨는 느낌을 만든다 */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(60,92,145,.20), transparent 62%),
    radial-gradient(70% 50% at 88% 8%, rgba(212,172,85,.07), transparent 60%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.4;
  background-image:linear-gradient(rgba(120,150,200,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(120,150,200,.045) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(100% 60% at 50% 0%,#000,transparent 75%);
  -webkit-mask-image:radial-gradient(100% 60% at 50% 0%,#000,transparent 75%);
}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 32px}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

/* ─── 히어로: 짧게. 첫 화면은 카드가 차지한다 ─── */
.hero{padding:58px 0 30px}
.eyebrow{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;
  color:var(--brass);margin-bottom:20px;display:flex;align-items:center;gap:12px;
}
.eyebrow::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(212,172,85,.4),transparent);max-width:200px}
h1{
  font-weight:600;font-size:clamp(30px,4.6vw,50px);line-height:1.12;
  letter-spacing:-.035em;margin-bottom:16px;
  text-shadow:0 2px 30px rgba(0,0,0,.5);
}
h1 span{color:var(--brass)}
.lede{color:var(--text-2);max-width:50ch;font-size:16px}
.site-link{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;
  color:var(--text-2);text-decoration:none;
  margin-top:14px;padding-bottom:3px;
  border-bottom:1px solid var(--line);
  transition:color .2s,border-color .2s;
}
.site-link:hover{color:var(--brass);border-color:var(--brass)}
.hero-meta{
  font-family:var(--mono);font-size:11px;color:var(--dim);
  margin-top:22px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
}
.hero-meta b{color:var(--text-2);font-weight:500}
.hero-meta i{font-style:normal;color:var(--line)}

/* ─── 범주 칩 ─── */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
.chips button{
  font-family:var(--mono);font-size:11.5px;cursor:pointer;
  background:rgba(19,30,51,.6);border:1px solid var(--line);color:var(--text-2);
  padding:7px 15px;display:inline-flex;align-items:center;gap:9px;
  transition:color .2s,border-color .2s,background .2s;
}
.chips button:hover{color:var(--text);border-color:#33496B}
.chips button .n{font-size:10px;color:var(--dim)}
.chips button[aria-pressed="true"]{color:var(--c,var(--text-2));border-color:currentColor;background:rgba(255,255,255,.04);box-shadow:inset 0 -2px 0 currentColor}
.chips button[data-k="all"][aria-pressed="true"]{box-shadow:inset 0 -2px 0 var(--text-2)}

/* ─── 정사각 카드 그리드 ─── */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{
  position:relative;aspect-ratio:1/1;cursor:pointer;text-align:left;
  background:linear-gradient(163deg,var(--surface-2),var(--surface) 62%);
  border:1px solid var(--line);color:inherit;font-family:var(--sans);
  padding:20px;display:flex;flex-direction:column;
  transition:border-color .25s,transform .25s,box-shadow .25s;
  opacity:0;transform:translateY(14px);
}
body.ready .card{opacity:1;transform:none;transition:border-color .25s,transform .45s cubic-bezier(.2,.8,.3,1),opacity .45s,box-shadow .25s}
.card[hidden]{display:none}
.card::before{
  content:'';position:absolute;top:-1px;left:-1px;right:-1px;height:2px;
  background:var(--c);opacity:.85;
}
.card:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 18px 40px -18px rgba(0,0,0,.9)}
.card[aria-expanded="true"]{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}

.c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.c-cat{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--c)}
.c-state{font-family:var(--mono);font-size:9.5px;color:var(--dim);display:flex;align-items:center;gap:6px;white-space:nowrap}
.c-state i{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none}
.c-state.live i{background:var(--sage);box-shadow:0 0 0 3px rgba(127,179,156,.18)}

.c-art{flex:1;display:grid;place-items:center;padding:14px 0 8px;min-height:0}
.c-art svg{width:100%;max-width:132px;height:auto;overflow:visible}
.c-cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--dim);text-align:center;margin-top:-4px}

.c-name{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:10px;line-height:1.3}
.c-sub{font-size:12.5px;color:var(--text-2);line-height:1.5;margin-top:2px}
.c-foot{
  font-family:var(--mono);font-size:10px;color:var(--dim);
  margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft);
  display:flex;justify-content:space-between;gap:8px;
}
.c-foot .est{color:var(--brass);opacity:.75}

/* 카드 도형 */
[data-fill]{transition:opacity .5s,fill .3s}
.pulse{animation:drift 4.2s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-2.5px)}}

/* ─── 상세 ─── */
.detail{
  margin-top:16px;border:1px solid var(--line);background:var(--surface);
  display:none;
}
.detail.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.d-head{
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:20px 26px;border-bottom:1px solid var(--line-soft);
}
.d-head h3{font-size:19px;font-weight:600;letter-spacing:-.02em}
.d-head h3 em{font-style:normal;font-size:13px;color:var(--text-2);font-weight:400;margin-left:9px}
.d-close{
  font-family:var(--mono);font-size:11px;background:none;border:1px solid var(--line);
  color:var(--text-2);padding:6px 13px;cursor:pointer;transition:color .2s,border-color .2s;
}
.d-close:hover{color:var(--text);border-color:#33496B}
.d-body{padding:26px 26px 30px;display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:0 46px;align-items:start}
.d-body dt{font-family:var(--mono);font-size:10px;letter-spacing:.17em;color:var(--brass);margin-bottom:7px}
.d-body dd{color:var(--text-2);margin-bottom:22px}
.d-body dd:last-child{margin-bottom:0}
.d-body dd.hold{color:var(--text);border-left:2px solid var(--sage);padding-left:14px}
.d-side{border-left:1px solid var(--line-soft);padding-left:30px;align-self:stretch}
.d-side dt{font-family:var(--mono);font-size:10px;letter-spacing:.17em;color:var(--brass);margin-bottom:7px}
.d-side dd{color:var(--text-2);font-size:14px;margin-bottom:22px}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 24px}
.tag{font-family:var(--mono);font-size:10.5px;color:var(--text-2);border:1px solid var(--line);padding:4px 10px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.act{
  font-family:var(--mono);font-size:11.5px;text-decoration:none;
  border:1px solid var(--brass);color:var(--brass);padding:9px 17px;
  transition:background .2s;
}
.act:hover{background:rgba(212,172,85,.12)}
.act.ghost{border-color:var(--line);color:var(--text-2)}
.act.ghost:hover{background:rgba(34,52,79,.5)}
.act.off{border-color:var(--line-soft);color:var(--dim);pointer-events:none}

/* ─── 매트릭스 ─── */
section{margin-top:78px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:7px}
.sec-head h2{font-size:17px;font-weight:600;letter-spacing:-.015em}
.sec-head span{font-family:var(--mono);font-size:10px;letter-spacing:.17em;color:var(--dim)}
.sec-note{color:var(--dim);font-size:13px;margin-bottom:22px;max-width:62ch}

.matrix{border:1px solid var(--line);background:var(--surface)}
.mx-row{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--cols),58px) 54px;border-bottom:1px solid var(--line-soft)}
.mx-row:last-child{border-bottom:0}
.mx-row.head{border-bottom:1px solid var(--line);background:var(--surface-2)}
.mx-row.band{background:rgba(34,52,79,.3)}
.mx-row.band .mx-lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;color:var(--brass);padding:11px 18px}
.mx-lab{padding:11px 18px;font-size:14px;color:var(--text-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx-row.head .mx-lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;color:var(--dim);padding:13px 18px}
.mx-cell{border-left:1px solid var(--line-soft);display:grid;place-items:center}
.mx-row.head .mx-cell{
  border-left-color:var(--line);font-family:var(--mono);font-size:10px;color:var(--text-2);
  padding:11px 4px;text-align:center;line-height:1.3;word-break:keep-all;cursor:pointer;transition:color .2s;
}
.mx-row.head .mx-cell:hover{color:var(--brass)}
.dot{width:10px;height:10px;background:transparent;border:1px solid #263752;transform:scale(.35);opacity:0;
     transition:transform .35s cubic-bezier(.2,.8,.3,1),opacity .35s,background .2s,box-shadow .2s,border-color .2s}
.dot.on{background:#7E9BC9;border-color:#7E9BC9}
body.ready .dot{transform:scale(1);opacity:1}
.matrix[data-hot] .dot.on{background:#2B3D5C}
.matrix[data-hot] .dot.on.hot{background:var(--brass);box-shadow:0 0 0 4px rgba(212,172,85,.14)}
.mx-count{border-left:1px solid var(--line-soft);display:grid;place-items:center;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.mx-row.head .mx-count{border-left-color:var(--line);font-size:9.5px;letter-spacing:.12em}
.mx-legend{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:12px}

footer{margin:70px 0 0;padding:24px 0 60px;border-top:1px solid var(--line-soft)}
footer p{font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.9}

/* ─── 반응형 ─── */
@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .wrap{padding:0 22px}
  .grid > .detail{grid-column:1/-1;margin-top:0;margin-bottom:2px}
  .d-body{grid-template-columns:1fr;gap:0}
  .d-side{border-left:0;padding-left:0;padding-top:6px;margin-top:4px}
}
@media(max-width:620px){
  body{font-size:15px}
  .hero{padding:38px 0 24px}
  .grid{grid-template-columns:1fr;gap:14px}
  .card{aspect-ratio:auto;min-height:270px}
  .mx-row{grid-template-columns:minmax(0,1fr) repeat(var(--cols),42px) 38px}
  .mx-lab{padding:10px 12px;font-size:12.5px}
  .mx-row.head .mx-cell{font-size:9px;padding:10px 2px}
  .d-head,.d-body{padding-left:18px;padding-right:18px}
}
@media(prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation:none!important}
  .dot{opacity:1;transform:scale(1)}
  .card{opacity:1;transform:none}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <p class="eyebrow">PEOPLEQUAKE LAB ／ BUILD RECORD Hub</p>
    <h1>기획부터 배포까지<br><span>직접 만든</span> 웹 앱</h1>
    <p class="lede">반갑습니다. 기획부터 배포까지, Peoplequake Lab의 개발 허브입니다</p>
    <a class="site-link" href="https://peoplequake.co.kr" target="_blank" rel="noopener">Peoplequake Lab 홈페이지 ↗</a>    
    <p class="hero-meta" id="heroMeta"></p>
  </header>

  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div class="detail" id="detail" aria-live="polite"></div>

  <section id="matrix">
    <div class="sec-head"><h2>기술 매트릭스</h2><span>CAPABILITY MATRIX</span></div>
    <p class="sec-note">HTML·CSS처럼 기본에 해당하는 항목은 포함되지 않습니다<br>앱 이름에 커서를 올리면 그 앱의 사용 범위만 표시됩니다</p>
    <div class="matrix" id="mx"></div>
  </section>

  <footer><p id="foot"></p></footer>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   새 앱 추가 → APPS 배열 맨 앞에 항목 하나 추가.
   새 기술 추가 → GROUPS 에 같은 이름 추가.
   그 외 코드는 손댈 필요 없습니다.
   ══════════════════════════════════════════════════════════════ */

const FIRST_BUILD = '2026-08-01';

const CATS = {
  business:{ label:'사업 자산', en:'BUSINESS', color:'var(--brass)' },
  daily:{ label:'일상', en:'DAILY', color:'var(--slate)' },
  care:    { label:'돌봄', en:'CARE',   color:'var(--sage)'  }
};

const GROUPS = [
  { band:'배포 · 구조', items:['GitHub Pages 배포','React (CDN 트랜스파일)','PWA · Service Worker'] },
  { band:'데이터 설계', items:['Firebase Realtime Database','localStorage 스키마','Web Share API 백업'] },
  { band:'인증 · 보안', items:['Firebase Google 인증','보안 규칙 (auth.uid 대조)','CSP 강화 (default-src none)'] },
  { band:'측정 로직',   items:['2축 문항 채점 알고리즘'] }
];

const APPS = [
  {
    id:'beonjim', name:'번짐 Beonjim', sub:'한 번의 입력으로 연쇄를 만드는 캐주얼 웹 게임',
    cat:'daily', art:'ripple', cap:'연쇄 반응 · 캐주얼 웹 게임',
    date:'2026-08-30', dateEst:false, dateLabel:'배포',
    status:'live', statusLabel:'운영 중',
    url:'https://peoplequake-lab.github.io/beonjim', repo:'',
    why:'쉬려고 켠 게임이 오히려 자원을 더 쓰게 만드는 경우가 많습니다. 대부분의 캐주얼 게임이 지속적인 입력과 실시간 판단을 요구하기 때문입니다. 소진된 상태에서는 그 요구 자체가 부담이 되어, 휴식이 아니라 또 하나의 과업이 됩니다. 번짐은 이 지점을 뒤집어 설계했습니다. 사용자의 입력을 한 판당 단 한 번으로 제한하고, 그 뒤의 시간은 전부 지켜보는 시간으로 만들었습니다. 결정은 한 번뿐이지만 그 결과는 길게 이어지고, 실패해도 잃는 것이 없으며, 다시 누르면 됩니다. 판단 비용은 최소로 두되 시각적 보상은 크게 남기는 것이 이 게임의 유일한 설계 목표였습니다.',
    how:'화면을 누르면 그 자리에 원이 생성되고, 원의 반경 안에 들어온 점은 그 위치에서 다시 원으로 전환됩니다. 연쇄를 위한 별도 로직은 없습니다. 이 전환 규칙 하나만으로 파급이 발생하도록 만들었습니다. 원은 확장·유지·소멸의 세 상태를 순환하며, 유지 구간의 길이가 연쇄의 성패를 가르는 핵심 변수입니다. 난이도는 단계별 표를 나열하지 않고 파라미터 생성 함수로 처리했습니다. 단계 번호를 넣으면 점의 개수, 이동 속도, 번짐 반경, 유지 시간, 궤적의 곡률을 반환하는 구조라, 8단계마다 성격이 바뀌고 45단계 이후로는 조건이 겹치며 무한히 이어집니다. 진행도는 서버 없이 클라이언트에 저장해 로그인 없이 각자의 기록이 유지되도록 했고, 서비스워커로 정적 자원을 캐싱해 접속이 끊긴 상태에서도 실행됩니다.',
    stack:['Canvas 2D 렌더링','상태 기계 기반 연쇄 판정','파라미터 생성형 난이도','PWA · Service Worker','클라이언트 진행도 저장','GitHub Pages 배포']
  },
  {
    id:'alive', name:'생존신고소', sub:'하루 한 번 도장으로 안부를 남기는 앱',
    cat:'daily', art:'stamp', cap:'하루 한 칸 · 7일 출석판',
    date:'2026-08-15', dateEst:false, dateLabel:'배포',
    status:'live', statusLabel:'운영 중 · 슬롯 형태',
    url:'https://peoplequake-lab.github.io/alive/', repo:'',
    why:'안부 확인 서비스의 핵심 지표는 응답률이 아니라 무응답 탐지입니다. 그런데 메신저나 통화로 수시로 안부를 주고받으려고 하면 「무엇을 쓸지(말할지) 정하는」 인지 비용이 매번 붙고, 그 비용 때문에 응답이 밀리기 시작하면 무응답이 이상 신호인지 단순한 귀찮음인지 구분되지 않습니다. 이는 지표가 오염되는 것이라고 할 수 있습니다. 그래서 응답을 문장이 아니라 이진 이벤트로 축소하고자 했습니다. 입력 비용을 탭 한 번까지 낮춰야 무응답 자체가 해석 가능한 신호가 될 것으로 보고 설계했습니다.',
    how:'도장을 누르면 Firebase에 즉시 기록되고 가족 전원 화면에 실시간 반영됩니다. 보안 규칙은 최상위가 아니라 방(room) 단위에서 auth.uid를 대조하도록 걸어, 실수로 주소가 공유되어도 미등록자가 데이터를 확인할 수 없도록 설계했습니다.',
    stack:['GitHub Pages 배포','PWA · Service Worker','Firebase Realtime Database','Firebase Google 인증','보안 규칙 (auth.uid 대조)']

    cat:'care', art:'blister', cap:'하루 3칸 · 7일 시트',
    date:'2026-08-15', dateEst:false, dateLabel:'제작',

    how:'외부 CDN을 하나도 쓰지 않고 단일 파일로 완결시켰습니다. CSP를 default-src none까지 조여 외부 통신 자체를 막았고, 데이터가 사라질 위험은 14일 주기 백업 알림(Web Share API)으로 상쇄했습니다.',
    hold:'개인 건강 기록을 다루는 앱이라, 브라우저 저장소의 격리 단위를 기준으로 배포 위치를 먼저 검토했습니다. 다른 앱과 도메인을 공유하는 현재 구조로는 이 데이터에 요구되는 격리 수준을 만족하지 못한다고 판단해, 전용 도메인을 분리하기 전까지 배포를 보류했습니다. 기능은 완성되어 있고, 남은 것은 배포 환경 결정입니다.',
    stack:['PWA · Service Worker','localStorage 스키마','Web Share API 백업','CSP 강화 (default-src none)']

  {

    date:'2026-08-01', dateEst:false, dateLabel:'배포',

    url:'https://peoplequake-lab.github.io/ai-humanities-quiz/', repo:'',
    why:'검사를 외부 설문 플랫폼에 올려두면 두 가지가 남의 손에 넘어갑니다. 첫째는 문항과 채점 키입니다. 검사 도구의 핵심 자산이 제3자 서버에 상주하고, 반출 가능 여부와 형식이 그쪽 정책에 달립니다. 둘째는 결과 화면입니다. 이 화면이 곧 리드 전환 지점인데 문구 하나 고칠 권한이 없었습니다. 구독이 끊기거나 서비스가 종료되면 검사 자체가 멈추는 벤더 종속(vendor lock-in) 구조라고 판단했습니다. 그래서 외부 런타임 의존성이 없는 정적 배포로 옮겨 문항·채점 로직·결과 화면의 통제권을 전부 회수했습니다. 전환 비용은 지금 한 번 치르는 개발 시간이고, 종속 비용은 서비스가 존재하는 내내 발생합니다.',
    how:'7개 문항의 응답을 AI 수용도와 판단 주체성 두 축의 점수로 환산해 네 개 유형에 배정합니다. 배포 전에 가능한 응답 조합 16,384건을 전수 채점해 동점과 이상치가 없는지 확인했습니다.',
    stack:['GitHub Pages 배포','React (CDN 트랜스파일)','2축 문항 채점 알고리즘']
  }
];

const $ = s => document.querySelector(s);

/* ─── 카드 도형 (앱의 실제 구조를 축약한 그림) ─── */
const ART = {
  stamp(c){
    const ROWS = 4, COLS = 7;        // ← 사람 수, 일 수
    const on = [                      // ← 채울 칸 [행, 열] · 0부터 셈
      [0,1],[0,2],[0,4],[0,5],[0,6],
      [1,0],[1,2],[1,3],[1,5],[1,6],
      [2,1],[2,3],[2,6],
      [3,0],[3,2],[3,3],[3,5]
    ];
    const gap = 19, r = 7.5, pad = r + 1.5;
    const w = pad*2 + (COLS-1)*gap, h = pad*2 + (ROWS-1)*gap;
    let s = '<svg viewBox="0 0 '+w+' '+h+'" aria-hidden="true">';
    for(let row=0; row<ROWS; row++) for(let i=0; i<COLS; i++){
      const hit = on.some(p => p[0]===row && p[1]===i);
      const op  = hit ? Math.max(.28, .95 - row*.22) : 0;
      s += '<circle cx="'+(pad+i*gap)+'" cy="'+(pad+row*gap)+'" r="'+r+'" '+
           'fill="'+(hit?c:'none')+'" fill-opacity="'+op+'" '+
           'stroke="'+(hit?'none':'#2A3D5C')+'" stroke-width="1" '+
           'style="transition-delay:'+((row*COLS+i)*32)+'ms"/>';
    }
    return s+'</svg>';
  },  blister(c){
    let s = '<svg viewBox="0 0 100 82" aria-hidden="true">';
    const on = [0,1,3,4,6,8,9,10];
    for(let r=0;r<4;r++) for(let i=0;i<3;i++){
      const k=r*3+i, hit=on.includes(k);
      s += '<rect x="'+(6+i*32)+'" y="'+(5+r*20)+'" width="24" height="13" rx="6.5" '+
           'fill="'+(hit?c:'none')+'" fill-opacity="'+(hit?.85:0)+'" stroke="'+(hit?'none':'#2A3D5C')+'" stroke-width="1"/>';
    }
    return s+'</svg>';
  },
  quadrant(c){
    return '<svg viewBox="0 0 100 100" aria-hidden="true">'+
      '<rect x="50" y="4" width="46" height="46" fill="'+c+'" fill-opacity=".07"/>'+
      '<line x1="50" y1="2" x2="50" y2="98" stroke="#2A3D5C" stroke-width="1"/>'+
      '<line x1="2" y1="50" x2="98" y2="50" stroke="#2A3D5C" stroke-width="1"/>'+
      '<line x1="50" y1="30" x2="72" y2="30" stroke="'+c+'" stroke-width="1" stroke-dasharray="2 3" opacity=".55"/>'+
      '<line x1="72" y1="30" x2="72" y2="50" stroke="'+c+'" stroke-width="1" stroke-dasharray="2 3" opacity=".55"/>'+
      '<g class="pulse"><circle cx="72" cy="30" r="12" fill="'+c+'" fill-opacity=".12"/>'+
      '<circle cx="72" cy="30" r="5" fill="'+c+'"/></g>'+
      '<text x="8" y="14" font-family="monospace" font-size="7" fill="#5A7096">유형</text></svg>';
  },
  ripple(c){
    const cx = 50, cy = 50;
    const rings = [42, 27, 13];       // ← 번짐의 세 단계
    let s = '<svg viewBox="0 0 100 100" aria-hidden="true">';
    rings.forEach((r, i) => {
      s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+c+'" fill-opacity="'+(.035 + i*.025)+'" '+
           'stroke="'+c+'" stroke-width="1" stroke-opacity="'+(.30 + i*.22)+'" '+
           'style="transition-delay:'+((rings.length-1-i)*140)+'ms"/>';
    });
    // 아직 닿지 않은 점들
    const dots = [[20,26],[80,22],[16,72],[84,74],[50,12],[50,88]];
    dots.forEach((p, i) => {
      s += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.6" fill="none" '+
           'stroke="#2A3D5C" stroke-width="1" '+
           'style="transition-delay:'+(420 + i*60)+'ms"/>';
    });
    s += '<g class="pulse"><circle cx="'+cx+'" cy="'+cy+'" r="4" fill="'+c+'"/></g>';
    return s+'</svg>';
  }
};

/* ─── 히어로 메타 ─── */
const uniq = [...new Set(APPS.flatMap(a=>a.stack))];
const days = Math.max(1, Math.floor((Date.now()-new Date(FIRST_BUILD+'T00:00:00+09:00'))/864e5));
$('#heroMeta').innerHTML =
  '개발 앱 <b>'+APPS.length+'</b><i>／</i>운영 중 <b>'+APPS.filter(a=>a.status==='live').length+'</b>'+
  '<i>／</i>활용 기술 <b>'+uniq.length+'</b><i>／</i>최초 개발일 이후 <b>'+days+'</b>일';
$('#foot').textContent = 'Peoplequake Lab 개발 허브 사이트입니다 ㅣ Peoplequake Lab · GitHub Pages';

/* ─── 카드 ─── */
const grid = $('#grid');
APPS.forEach((a,i)=>{
  const cat = CATS[a.cat];
  const raw = getComputedStyle(document.documentElement).getPropertyValue(cat.color.replace('var(','').replace(')','')).trim();
  const b = document.createElement('button');
  b.className='card'; b.type='button'; b.dataset.cat=a.cat; b.dataset.id=a.id;
  b.setAttribute('aria-expanded','false');
  b.style.setProperty('--c', cat.color);
  b.style.transitionDelay = (i*90)+'ms';
  b.innerHTML =
    '<span class="c-top"><span class="c-cat">'+cat.en+' ／ '+cat.label+'</span>'+
      '<span class="c-state '+(a.status==='live'?'live':'')+'"><i></i>'+
      (a.status==='live'?'운영 중':'배포 보류')+'</span></span>'+
    '<span class="c-art">'+ART[a.art](raw)+'</span>'+
    '<span class="c-cap">'+a.cap+'</span>'+
    '<span class="c-name">'+a.name+'</span>'+
    '<span class="c-sub">'+a.sub+'</span>'+
    '<span class="c-foot"><span'+(a.dateEst?' class="est"':'')+'>'+a.dateLabel+' '+a.date+(a.dateEst?' (추정)':'')+'</span>'+
      '<span>기술 '+a.stack.length+'종</span></span>';
  b.addEventListener('click',()=>openDetail(a.id));
  grid.appendChild(b);
});

/* ─── 상세 ─── */
const detail = $('#detail');
let openId = null;

/* 좁은 화면(카드 1열)에서는 상세를 클릭한 카드 바로 아래로 옮긴다.
   넓은 화면에서는 원래대로 카드 목록 전체 아래에 둔다. */
const narrow = window.matchMedia('(max-width:900px)');
function placeDetail(){
  if(!openId) return;
  const card = grid.querySelector('.card[data-id="'+openId+'"]');
  if(!card) return;
  if(narrow.matches) card.insertAdjacentElement('afterend', detail);
  else grid.insertAdjacentElement('afterend', detail);
}
narrow.addEventListener('change', placeDetail);

function openDetail(id){
  if(openId===id){ closeDetail(); return; }
  const a = APPS.find(x=>x.id===id);
  openId = id;
  placeDetail();
  document.querySelectorAll('.card').forEach(c=>c.setAttribute('aria-expanded', c.dataset.id===id?'true':'false'));
  detail.innerHTML =
    '<div class="d-head"><h3>'+a.name+'<em>'+a.sub+'</em></h3>'+
      '<button class="d-close" type="button">닫기 ✕</button></div>'+
    '<div class="d-body"><dl>'+
      '<dt>WHY ／ 기획·개발 목적</dt><dd>'+a.why+'</dd>'+
      '<dt>HOW ／ 구조</dt><dd>'+a.how+'</dd>'+
      (a.hold?'<dt>HOLD ／ 미배포 사유 </dt><dd class="hold">'+a.hold+'</dd>':'')+
      '<dt>STATUS ／ 현재 상태</dt><dd>'+a.statusLabel+'</dd>'+
      '<dt>STACK</dt></dl>'+
      '<div class="tags">'+a.stack.map(s=>'<span class="tag">'+s+'</span>').join('')+'</div>'+
      '<div class="acts">'+
        (a.url?'<a class="act" href="'+a.url+'" target="_blank" rel="noopener">앱 열기 ↗</a>'
              :'<span class="act off">미배포 </span>')+
        (a.repo?'<a class="act ghost" href="https://github.com/'+a.repo+'" target="_blank" rel="noopener">저장소 ↗</a>':'')+
      '</div></div>';
  detail.classList.add('on');
  detail.querySelector('.d-close').addEventListener('click',closeDetail);
}
function closeDetail(){
  openId=null; detail.classList.remove('on'); detail.innerHTML='';
  grid.insertAdjacentElement('afterend', detail);
  document.querySelectorAll('.card').forEach(c=>c.setAttribute('aria-expanded','false'));
}

/* ─── 범주 칩 ─── */
const chips = $('#chips');
[{k:'all',t:'전체'}].concat(Object.keys(CATS).map(k=>({k,t:CATS[k].label}))).forEach((c,i)=>{
  const n = c.k==='all' ? APPS.length : APPS.filter(a=>a.cat===c.k).length;
  const b=document.createElement('button');
  b.type='button'; b.dataset.k=c.k;
  b.setAttribute('aria-pressed', i===0?'true':'false');
  if(c.k!=='all') b.style.setProperty('--c', CATS[c.k].color);
  b.innerHTML=c.t+'<span class="n">'+n+'</span>';
  b.addEventListener('click',()=>{
    chips.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    closeDetail();
    document.querySelectorAll('.card').forEach(card=>{
      card.hidden = !(c.k==='all' || card.dataset.cat===c.k);
    });
  });
  chips.appendChild(b);
});

/* ─── 매트릭스 ─── */
const mx=$('#mx');
mx.style.setProperty('--cols',APPS.length);
const head=document.createElement('div');
head.className='mx-row head';
head.innerHTML='<div class="mx-lab">TECHNOLOGY</div>';
APPS.forEach(a=>{
  const c=document.createElement('div');
  c.className='mx-cell'; c.textContent=a.name; c.tabIndex=0;
  const on=()=>mx.setAttribute('data-hot',a.id), off=()=>mx.removeAttribute('data-hot');
  c.addEventListener('mouseenter',on); c.addEventListener('mouseleave',off);
  c.addEventListener('focus',on); c.addEventListener('blur',off);
  head.appendChild(c);
});
head.insertAdjacentHTML('beforeend','<div class="mx-count">USED</div>');
mx.appendChild(head);

GROUPS.forEach(g=>{
  const band=document.createElement('div');
  band.className='mx-row band';
  band.innerHTML='<div class="mx-lab">'+g.band+'</div>'+
    APPS.map(()=>'<div class="mx-cell"></div>').join('')+'<div class="mx-count"></div>';
  mx.appendChild(band);
  g.items.forEach(tech=>{
    const row=document.createElement('div');
    row.className='mx-row';
    const lab=document.createElement('div');
    lab.className='mx-lab'; lab.textContent=tech; lab.title=tech;
    row.appendChild(lab);
    let used=0;
    APPS.forEach(a=>{
      const cell=document.createElement('div'); cell.className='mx-cell';
      const d=document.createElement('span'); d.className='dot';
      if(a.stack.includes(tech)){ d.classList.add('on'); d.dataset.app=a.id; used++; }
      cell.appendChild(d); row.appendChild(cell);
    });
    const cnt=document.createElement('div'); cnt.className='mx-count'; cnt.textContent=used;
    row.appendChild(cnt); mx.appendChild(row);
  });
});
new MutationObserver(()=>{
  const hot=mx.getAttribute('data-hot');
  mx.querySelectorAll('.dot.on').forEach(d=>d.classList.toggle('hot',d.dataset.app===hot));
}).observe(mx,{attributes:true,attributeFilter:['data-hot']});
mx.querySelectorAll('.mx-row:not(.head) .dot').forEach((d,i)=>{ d.style.transitionDelay=(320+i*30)+'ms'; });

document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDetail(); });
requestAnimationFrame(()=>document.body.classList.add('ready'));
</script>
